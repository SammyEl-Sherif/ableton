<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>
  body { font-family: -apple-system, Helvetica, sans-serif; font-size: 13px; line-height: 1.45; color: #1d1d1f; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  ol { margin: 0; padding-left: 1.2em; }
  li { margin-bottom: 6px; }
</style>
</head>
<body>
  <h1>__DISPLAY_NAME__ is installed</h1>
  <p>In <strong>Ableton Live</strong>:</p>
  <ol>
    <li>Open <strong>Preferences → Plug-ins</strong>.</li>
    <li>Turn on <strong>Use VST3 Plug-In System Folders</strong>.</li>
    <li>Click <strong>Rescan</strong> (hold <strong>Option</strong> for a full rescan).</li>
    <li>Add <strong>__DISPLAY_NAME__</strong> from Plug-Ins → VST3 → Animal Audio on an audio track.</li>
  </ol>
</body>
</html>
