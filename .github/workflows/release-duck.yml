# Manual Duck release on macOS (sign + notarize + validate + optional Supabase upload).
# Version comes from project(AnimalAudio VERSION …) in CMakeLists.txt — bump that before you ship.
#
# Repository secrets: docs/GITHUB_ACTIONS_SECRETS.md
name: Release Duck (macOS)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to Supabase after validation
        type: boolean
        default: false
      publish_github_release:
        description: Create or update GitHub Release v{VERSION} with Mac artifacts
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Read release version (CMake)
        id: version
        run: echo "value=$(python3 scripts/read_project_version.py)" >> "$GITHUB_OUTPUT"

      - name: Checkout animal-audio-web
        if: ${{ inputs.upload }}
        uses: actions/checkout@v4
        with:
          repository: SammyEl-Sherif/animal-audio-web
          path: animal-audio-web
          token: ${{ secrets.AA_WEB_REPO_GITHUB_TOKEN != '' && secrets.AA_WEB_REPO_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Ninja
        run: brew install ninja

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.AA_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.AA_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12_BASE64:-}" ]; then
            echo "AA_DEVELOPER_ID_P12_BASE64 secret is required for signed releases."
            exit 1
          fi
          echo "$P12_BASE64" | base64 --decode > /tmp/devid.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/devid.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain

      - name: Write notary API key
        env:
          P8_BASE64: ${{ secrets.AA_NOTARY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect
          echo "$P8_BASE64" | base64 --decode > ~/.appstoreconnect/AuthKey.p8
          cat >> ~/.appstoreconnect/notary.env <<EOF
          export AA_CODESIGN_IDENTITY="${{ secrets.AA_CODESIGN_IDENTITY }}"
          export AA_INSTALLER_CODESIGN_IDENTITY="${{ secrets.AA_INSTALLER_CODESIGN_IDENTITY }}"
          export AA_NOTARY_KEY="\$HOME/.appstoreconnect/AuthKey.p8"
          export AA_NOTARY_KEY_ID="${{ secrets.AA_NOTARY_KEY_ID }}"
          export AA_NOTARY_ISSUER="${{ secrets.AA_NOTARY_ISSUER }}"
          EOF

      - name: Release pipeline
        env:
          AA_DUCK_VERSION: ${{ steps.version.outputs.value }}
          AA_WEB_REPO: ${{ github.workspace }}/animal-audio-web
          AA_SUPABASE_ACCESS_TOKEN: ${{ secrets.AA_SUPABASE_ACCESS_TOKEN }}
          AA_SUPABASE_DB_PASSWORD: ${{ secrets.AA_SUPABASE_DB_PASSWORD }}
          AA_SUPABASE_PROJECT_REF: huivhdradgroykfvtclx
        run: |
          set -euo pipefail
          source ~/.appstoreconnect/notary.env
          upload_flag=--skip-upload
          if [ "${{ inputs.upload }}" = "true" ]; then
            upload_flag=--upload
          fi
          ./scripts/release_duck.sh $upload_flag

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duck-release-${{ steps.version.outputs.value }}-mac
          path: dist/releases/${{ steps.version.outputs.value }}/
          if-no-files-found: error

      - name: Publish GitHub Release (mac)
        if: ${{ inputs.publish_github_release }}
        uses: ./.github/actions/publish-duck-github-release
        with:
          version: ${{ steps.version.outputs.value }}
          files: |
            dist/releases/${{ steps.version.outputs.value }}/Duck-${{ steps.version.outputs.value }}-mac-installer.pkg
            dist/releases/${{ steps.version.outputs.value }}/manifest-mac.json
