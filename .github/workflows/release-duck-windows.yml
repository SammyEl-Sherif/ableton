# Manual Duck Windows release: build → test → zip → validate → optional Supabase upload.
#
# Repository secrets (Settings → Secrets → Actions):
#   AA_SUPABASE_ACCESS_TOKEN   Supabase personal access token (Dashboard → Account → Access Tokens)
#   AA_SUPABASE_DB_PASSWORD    Database password (for `supabase link` in CI)
# Optional:
#   AA_WEB_REPO_GITHUB_TOKEN   PAT with read access to animal-audio-web if GITHUB_TOKEN cannot checkout it
name: Release Duck (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 1.0.0)
        required: true
        default: "1.0.0"
      upload:
        description: Upload to Supabase after validation
        type: boolean
        default: true

env:
  AA_SUPABASE_PROJECT_REF: huivhdradgroykfvtclx

jobs:
  release-win:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Checkout animal-audio-web (Supabase CLI project)
        if: ${{ inputs.upload }}
        uses: actions/checkout@v4
        with:
          repository: SammyEl-Sherif/animal-audio-web
          path: animal-audio-web
          token: ${{ secrets.AA_WEB_REPO_GITHUB_TOKEN != '' && secrets.AA_WEB_REPO_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Release pipeline
        shell: pwsh
        env:
          AA_DUCK_VERSION: ${{ inputs.version }}
          AA_WEB_REPO: ${{ github.workspace }}/animal-audio-web
          AA_SUPABASE_ACCESS_TOKEN: ${{ secrets.AA_SUPABASE_ACCESS_TOKEN }}
          AA_SUPABASE_DB_PASSWORD: ${{ secrets.AA_SUPABASE_DB_PASSWORD }}
        run: |
          $upload = [bool]::Parse('${{ inputs.upload }}')
          if ($upload) {
            .\scripts\release_win_duck.ps1 -Version $env:AA_DUCK_VERSION -Upload
          } else {
            .\scripts\release_win_duck.ps1 -Version $env:AA_DUCK_VERSION
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duck-release-${{ inputs.version }}-win
          path: dist/releases/${{ inputs.version }}/
          if-no-files-found: error
