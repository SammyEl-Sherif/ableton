# Deprecated: use workflow "Release plugin" (plugin=duck, platform=win).
# Manual Duck Windows release: build → test → zip → validate → optional Supabase upload.
#
# Repository secrets: docs/GITHUB_ACTIONS_SECRETS.md
name: Release Duck (Windows)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to Supabase after validation
        type: boolean
        default: true
      publish_github_release:
        description: Create or update GitHub Release v{VERSION} with Windows artifacts
        type: boolean
        default: true

permissions:
  contents: write

env:
  AA_SUPABASE_PROJECT_REF: huivhdradgroykfvtclx

jobs:
  release-win:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release version (CMake)
        id: version
        shell: bash
        run: echo "value=$(python3 scripts/read_project_version.py)" >> "$GITHUB_OUTPUT"

      - name: Checkout animal-audio-web (Supabase CLI project)
        if: ${{ inputs.upload }}
        uses: actions/checkout@v4
        with:
          repository: SammyEl-Sherif/animal-audio-web
          path: animal-audio-web
          token: ${{ secrets.AA_WEB_REPO_GITHUB_TOKEN != '' && secrets.AA_WEB_REPO_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Release pipeline
        shell: pwsh
        env:
          AA_DUCK_VERSION: ${{ steps.version.outputs.value }}
          AA_WEB_REPO: ${{ github.workspace }}/animal-audio-web
          AA_SUPABASE_ACCESS_TOKEN: ${{ secrets.AA_SUPABASE_ACCESS_TOKEN }}
          AA_SUPABASE_DB_PASSWORD: ${{ secrets.AA_SUPABASE_DB_PASSWORD }}
        run: |
          $upload = [bool]::Parse('${{ inputs.upload }}')
          if ($upload) {
            .\scripts\release_win_duck.ps1 -Upload
          } else {
            .\scripts\release_win_duck.ps1
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duck-release-${{ steps.version.outputs.value }}-win
          path: dist/releases/${{ steps.version.outputs.value }}/
          if-no-files-found: error

      - name: Publish GitHub Release (Windows)
        if: ${{ inputs.publish_github_release }}
        uses: ./.github/actions/publish-duck-github-release
        with:
          version: ${{ steps.version.outputs.value }}
          files: |
            dist/releases/${{ steps.version.outputs.value }}/Duck-${{ steps.version.outputs.value }}-win-vst3.zip
            dist/releases/${{ steps.version.outputs.value }}/manifest-win.json
