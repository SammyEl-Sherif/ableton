name: Publish plugin GitHub Release
description: Tag slug-vX.Y.Z and attach release artifacts (one tag per plugin + semver).

inputs:
  tag:
    description: Full tag (e.g. duck-v1.0.0)
    required: true
  name:
    description: Release title (e.g. Duck 1.0.0)
    required: true
  files:
    description: Newline-separated artifact paths
    required: true

runs:
  using: composite
  steps:
    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag }}
        name: ${{ inputs.name }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: ${{ inputs.files }}
